version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-appimeal}
      DB_USERNAME: ${DB_USERNAME:-appimeal_user}
      DB_PASSWORD: ${DB_PASSWORD:-SecretPassword123!}
    depends_on:
      - db
    volumes:
      - storage_data:/var/www/html/storage

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-appimeal}
      MYSQL_USER: ${DB_USERNAME:-appimeal_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-SecretPassword123!}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-RootPassword123!}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
  storage_data:
